[package]
name = "swappable_vram_engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Threading", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[features]
default = []
wddm = ["dep:windows"]

[[bin]]
name = "svram-budget"
path = "src/bin/svram-budget.rs"
required-features = ["wddm"]
